name: churntern_play
description: Board game library management
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.2

  # Barcode scanning — requires camera permission strings (see SETUP.md)
  mobile_scanner: ^7.2.0

  # Cached network images
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^1.2.0

  # Typography
  google_fonts: ^8.0.2

  # Date formatting
  intl: ^0.20.2

  # Local persistence (Game Nite recent player names)
  shared_preferences: ^2.5.5

  # Shake-to-roll detection (Game Nite dice roller) — uses the native iOS
  # shake gesture, so it also works in the simulator (Device > Shake)
  shake_gesture: ^2.1.0

  # Avatar photo picking (Profile Details screen)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets tests fire synthetic shake events at the dice roller
  shake_gesture_platform_interface: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
