name: churtern_play
description: Board game library management
version: 1.1.0+2
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.2

  # Barcode scanning — requires camera permission strings (see SETUP.md)
  mobile_scanner: ^7.2.0

  # Cached network images
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^1.2.0

  # Date formatting
  intl: ^0.20.2

  # Local persistence (Game Nite recent player names)
  shared_preferences: ^2.5.5

  # Shake-to-roll detection (Game Nite dice roller) — uses the native iOS
  # shake gesture, so it also works in the simulator (Device > Shake)
  shake_gesture: ^2.1.0

  # Avatar photo picking (Profile Details screen)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets tests fire synthetic shake events at the dice roller
  shake_gesture_platform_interface: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/OFL-Literata.txt
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
    - assets/fonts/OFL-DMMono.txt

  # Bundled so no font is fetched from Google at runtime (works offline, and
  # the app makes no third-party network request for typography).
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Light.ttf
          weight: 300
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
